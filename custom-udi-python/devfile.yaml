schemaVersion: 2.2.2
metadata:
  generateName: workspace-python
  displayName: Python Multi-Version (pip / virtualenv)
  description: Python com setup completo para DevSpaces
  version: 2.0.0
  tags:
    - python
    - pip
    - virtualenv
components:
  - name: tools
    container:
      image: quay.io/marolive/custom-udi-python:2.0.0
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
      sourceMapping: /projects
      volumeMounts:
        - name: venv
          path: /home/user/.venv
        - name: containers-config
          path: /home/user/.config/containers
        - name: pip-config
          path: /home/user/.config/pip
      env:
        - name: PODMAN_IGNORE_CGROUPSV1_WARNING
          value: 'true'
        - name: HOME
          value: /home/user
        - name: XDG_CONFIG_HOME
          value: /home/user/.config
        - name: NEXUS_BASEURL
          value: "https://<NEXUSREPOSITORY>:8443/repository/public-yum-central"
        - name: NEXUS_PYPI_BASEURL
          value: "https://<NEXUSREPOSITORY>:8443/repository/public-pypi-central/simple"
  - name: venv
    volume:
      size: 1G
  - name: containers-config
    volume:
      size: 256Mi
  - name: pip-config
    volume:
      size: 64Mi
commands:
  - id: init-home
    exec:
      component: tools
      workingDir: /
      commandLine: |
        echo "== INIT START =="

        mkdir -p /home/user/.config/containers
        mkdir -p /home/user/.config/pip
        mkdir -p /home/user/.local/share/containers-vfs/storage

        RUNROOT="/tmp/containers-$(id -u)/runroot"
        GRAPHROOT="/home/user/.local/share/containers-vfs/storage"
        mkdir -p "$RUNROOT"

        if [ ! -f /home/user/.config/containers/storage.conf ]; then
        cat > /home/user/.config/containers/storage.conf <<EOF
        [storage]
        driver = "vfs"
        runroot = "$RUNROOT"
        graphroot = "$GRAPHROOT"

        [storage.options]
        additionalimagestores = []
        EOF
        echo "storage.conf criado com driver vfs"
        fi

        if [ ! -f /home/user/.config/pip/pip.conf ] && [ -n "${NEXUS_PYPI_BASEURL:-}" ]; then
        TRUSTED_HOST=$(echo "$NEXUS_PYPI_BASEURL" | sed -E 's|https?://([^/:]+).*|\1|')
        cat > /home/user/.config/pip/pip.conf <<EOF
        [global]
        index-url = ${NEXUS_PYPI_BASEURL}
        trusted-host = ${TRUSTED_HOST}
        timeout = 60
        EOF
        echo "pip.conf criado apontando para Nexus"
        fi

        chmod -R g+rwX /home/user/.config || true
        chmod -R g+rwX /home/user/.local || true

        echo "HOME=$HOME"
        ls -ld /home/user
        ls -ld /home/user/.config
        ls -ld /home/user/.config/containers

        echo "== INIT DONE =="
events:
  postStart:
    - init-home