schemaVersion: 2.2.2
metadata:
  generateName: workspace-python
  displayName: Python Multi-Version (pip / virtualenv)
  description: Python com setup completo para DevSpaces
  version: 2.0.1
  tags:
    - python
    - pip
    - virtualenv
components:
  - name: tools
    container:
      image: quay.io/marolive/custom-udi-python:2.0.1
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
      sourceMapping: /projects
      volumeMounts:
        - name: venv
          path: /home/user/.venv
        - name: container-storage
          path: /home/user/.local/share/containers-vfs
      env:
        - name: PODMAN_IGNORE_CGROUPSV1_WARNING
          value: 'true'
        - name: NEXUS_BASEURL
          value: "https://<NEXUSREPOSITORY>:8443/repository/public-yum-central"
        - name: NEXUS_PYPI_BASEURL
          value: "https://<NEXUSREPOSITORY>:8443/repository/public-pypi-central/simple"
  - name: venv
    volume:
      size: 1G
  - name: container-storage
    volume:
      size: 1G
