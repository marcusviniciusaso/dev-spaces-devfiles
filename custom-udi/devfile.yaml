schemaVersion: 2.2.2
metadata:
  name: custom-base-udi
  displayName: "Custom Base UDI(Dev Spaces 3.28)"
  description: "Container com tools baseado na UDI com az/kubectl/helm/oc/cekit/kind/podman..."
  version: 2.0.5
  tags: ["openshift", "kubernetes", "helm", "podman", "azure", "kubedock"]
components:
  - name: tools
    container:
      image: quay.io/marolive/custom-udi:3.0.7block
      mountSources: true
      sourceMapping: /projects
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '1'
      env:
        - name: NEXUS_BASEURL
          value: "https://<NEXUSREPOSITORY>:8443/repository/public-yum-central"
        - name: "PODMAN_IGNORE_CGROUPSV1_WARNING"
          value: "true"
