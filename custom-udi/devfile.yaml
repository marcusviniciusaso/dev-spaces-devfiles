schemaVersion: 2.2.2
metadata:
  name: custom-base-udi
  displayName: "Custom Base UDI(Dev Spaces 3.28)"
  description: "Container com tools baseado na UDI com az/kubectl/helm/oc/cekit/kind/podman..."
  version: 2.1.0
  tags: ["openshift", "kubernetes", "helm", "podman", "azure", "kubedock"]
components:
  - name: tools
    container:
      image: quay.io/marolive/custom-udi:3.0.9
      mountSources: true
      sourceMapping: /projects
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuLimit: '2'
      cpuRequest: '1'
      volumeMounts:
        - name: persistent-storage
          path: /home/user/persistent
      env:
        - name: CONTAINERS_STORAGE_CONF
          value: /home/user/persistent/.containers-storage.conf
        - name: CONTAINERS_STORAGE
          value: /home/user/persistent/.containers-storage
        - name: PODMAN_HOME
          value: /home/user/persistent/.podman
        - name: XDG_CONFIG_HOME
          value: /home/user/persistent/.config
        - name: XDG_DATA_HOME
          value: /home/user/persistent/.local/share
        - name: XDG_CACHE_HOME
          value: /home/user/persistent/.cache
        - name: VSCODE_AGENT_FOLDER
          value: /home/user/persistent/.vscode-server
        - name: ARTIFACTORY_BASEURL
          value: "https://<REPOSITORY>/artifactory/public-yum-central"
        - name: "PODMAN_IGNORE_CGROUPSV1_WARNING"
          value: "true"
  - name: persistent-storage
    volume:
      size: 10Gi
