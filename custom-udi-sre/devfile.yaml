schemaVersion: 2.2.2
metadata:
  name: custom-udi-sre
  displayName: "SRE (oc / kubectl / helm)"
  description: "Imagem SRE com oc, kubectl e helm, baseada na custom-udi"
  version: 2.1.0
  tags: ["sre", "kubernetes", "openshift", "helm"]
components:
  - name: tools
    container:
      image: quay.io/marolive/custom-udi-sre:2.2.0
      mountSources: true
      sourceMapping: /projects
      memoryLimit: 10Gi
      memoryRequest: 5Gi
      cpuLimit: "2"
      cpuRequest: "0.5"
      env:
        - name: PODMAN_IGNORE_CGROUPSV1_WARNING
          value: "true"
        - name: CONTAINERS_STORAGE_CONF
          value: /home/user/persistent/.containers-storage.conf
        - name: CONTAINERS_STORAGE
          value: /home/user/persistent/.containers-storage
        - name: PODMAN_HOME
          value: /home/user/persistent/.podman
        - name: KUBECONFIG
          value: /home/user/persistent/.kube/config
        - name: XDG_CONFIG_HOME
          value: /home/user/persistent/.config
        - name: XDG_DATA_HOME
          value: /home/user/persistent/.local/share
        - name: XDG_CACHE_HOME
          value: /home/user/persistent/.cache
        - name: VSCODE_AGENT_FOLDER
          value: /home/user/persistent/.vscode-server
      volumeMounts:
        - name: persistent-storage
          path: /home/user/persistent
  - name: prometheus
    container:
      image: quay.io/prometheus/prometheus:latest
      memoryLimit: 1Gi
      endpoints:
        - name: prometheus
          targetPort: 9090
          exposure: public
          protocol: http
      volumeMounts:
        - name: prometheus-data
          path: /prometheus
  - name: prometheus-data
    volume:
      size: 1Gi
  - name: grafana
    container:
      image: docker.io/grafana/grafana:latest
      memoryLimit: 1Gi
      endpoints:
        - name: grafana
          targetPort: 3000
          exposure: public
          protocol: http
  - name: persistent-storage
    volume:
      size: 10Gi
