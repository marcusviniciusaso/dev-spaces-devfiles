schemaVersion: 2.2.2
metadata:
  generateName: sre-sample
  displayName: "SRE Sample"
  description: "Imagem SRE com a imagem custom-udi como base"
  version: 1.1.0
  tags: ["sre"]
components:
  - name: tools
    container:
      image: quay.io/marolive/custom-udi-sre:2.0.1
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
      env:
        - name: NEXUS_BASEURL
          value: "https://<NEXUSREPOSITORY>:8443/repository/public-yum-central"
        - name: "PODMAN_IGNORE_CGROUPSV1_WARNING"
          value: "true"
  - name: prometheus
    container:
      image: quay.io/prometheus/prometheus:latest
      memoryLimit: 1Gi
      endpoints:
        - name: prometheus
          targetPort: 9090
          exposure: public
          protocol: http
      volumeMounts:
        - name: prometheus-data
          path: /prometheus
  - name: prometheus-data
    volume:
      size: 1Gi
  - name: grafana
    container:
      image: docker.io/grafana/grafana:latest
      memoryLimit: 1Gi
      endpoints:
        - name: grafana
          targetPort: 3000
          exposure: public
          protocol: http
